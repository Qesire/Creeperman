[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creeperman"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
worker = ["temporalio>=1.10,<2", "boto3>=1.36,<2"]
test = ["pytest>=8,<10"]
archive = ["warcio>=1.7,<2"]
source = ["protego>=0.3,<1"]
parquet = ["duckdb>=1.2,<3", "pyarrow>=18"]
media = ["pycdlib>=1.22,<2"]

[project.scripts]
creeperman = "creeperman.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
