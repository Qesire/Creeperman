[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creeperman"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
worker = ["temporalio>=1.10,<2", "boto3>=1.36,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
creeperman = "creeperman.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
